# Weekly dependency update PRs. Minor/patch bumps are grouped into one PR per
# ecosystem; major bumps arrive separately so each can be reviewed on its own.
# maplibre-gl is also vendored in assets/vendor/maplibre-gl/: a bump PR must
# re-copy the vendor files before it can merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    groups:
      github-actions:
        patterns: ["*"]
