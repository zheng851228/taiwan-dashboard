name: Route Condition Delegation Migration

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/migrate-route-condition-delegation.mjs
      - .github/workflows/route-condition-delegation-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass

      - name: Apply delegation migration
        run: node scripts/migrate-route-condition-delegation.mjs

      - name: Commit migration result
        run: |
          if git diff --quiet -- js/route-conditions.js; then
            echo "No route-condition changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/route-conditions.js
          git commit -m "refactor: delegate route condition presentation"
          git push origin HEAD:agent/portfolio-maintainability-pass
