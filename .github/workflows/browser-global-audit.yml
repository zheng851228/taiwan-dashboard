name: Browser Global Audit

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/audit-browser-globals.mjs
      - .github/workflows/browser-global-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Audit browser globals
        run: node scripts/audit-browser-globals.mjs
