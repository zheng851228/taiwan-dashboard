name: MapMod Test Boundary Finalizer

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/finalize-mapmod-test-boundary.mjs
      - .github/workflows/mapmod-test-boundary-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Finalize MapMod test boundary
        run: node scripts/finalize-mapmod-test-boundary.mjs
      - name: Commit result
        run: |
          if git diff --quiet -- js/main-ui.js scripts/check.sh docs/ARCHITECTURE.md; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main-ui.js scripts/check.sh docs/ARCHITECTURE.md
          git commit -m "refactor: finalize MapMod test boundary"
          git push origin HEAD:agent/portfolio-maintainability-pass
