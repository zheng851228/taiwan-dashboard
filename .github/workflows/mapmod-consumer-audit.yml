name: MapMod Consumer Audit

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/audit-mapmod-consumers.mjs
      - .github/workflows/mapmod-consumer-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Audit MapMod consumers
        run: node scripts/audit-mapmod-consumers.mjs
