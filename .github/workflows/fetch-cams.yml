name: Update cam-list

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小時更新一次
  workflow_dispatch:          # 也可手動觸發

permissions:
  contents: write

concurrency:
  group: update-cam-list
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch twipcam cam-list.json
        run: |
          curl --fail --show-error --silent --location \
            --retry 2 --max-time 60 \
            "https://www.twipcam.com/api/v1/cam-list.json" \
            -H "User-Agent: Mozilla/5.0" \
            -o cam-list.next.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('cam-list.next.json')
          data = json.loads(source.read_text())
          if not isinstance(data, list) or len(data) < 1000:
              raise SystemExit('CCTV snapshot rejected: expected at least 1000 cameras')
          valid = [item for item in data if isinstance(item, dict) and item.get('id') and item.get('lat') and (item.get('lon') or item.get('lng'))]
          if len(valid) < 1000:
              raise SystemExit('CCTV snapshot rejected: too few valid coordinates')
          Path('cam-list.json').write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')))
          print(f'筆數: {len(data)}；有效座標: {len(valid)}')
          source.unlink()
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cam-list.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update cam-list.json [skip ci]"
            git push
          fi
