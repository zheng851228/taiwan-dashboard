name: Map Request Bus Migration

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/migrate-map-request-bus.mjs
      - .github/workflows/map-request-bus-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Apply map request bus migration
        run: node scripts/migrate-map-request-bus.mjs
      - name: Commit migration result
        run: |
          if git diff --quiet -- js/main-ui.js js/desktop-dashboard.js js/enhancements.js js/ride-tools.js; then
            echo "No map request bus changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main-ui.js js/desktop-dashboard.js js/enhancements.js js/ride-tools.js
          git commit -m "refactor: route map view commands through bus requests"
          git push origin HEAD:agent/portfolio-maintainability-pass
