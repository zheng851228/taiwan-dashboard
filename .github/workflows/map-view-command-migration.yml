name: Map View Command Migration

on:
  push:
    branches:
      - refactor/map-view-command-boundary

permissions:
  contents: write

jobs:
  migrate:
    name: Route map view commands through bus once
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/map-view-command-boundary
          fetch-depth: 0

      - name: Apply map view command boundary
        run: |
          node scripts/migrate-map-view-command-boundary.mjs
          node --check js/main-ui.js
          node --check js/desktop-dashboard.js
          node --check js/enhancements.js
          node --check js/ride-tools.js
          git diff --check

      - name: Commit migration
        run: |
          if git diff --quiet -- js/main-ui.js js/desktop-dashboard.js js/enhancements.js js/ride-tools.js; then
            echo "Map view command boundary already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main-ui.js js/desktop-dashboard.js js/enhancements.js js/ride-tools.js
          git commit -m "refactor: route map view commands through bus requests"
          git push origin HEAD:refactor/map-view-command-boundary
