name: Map Overlay Lifecycle Migration

on:
  push:
    branches:
      - refactor/map-overlay-lifecycle-boundary

permissions:
  contents: write

jobs:
  migrate:
    name: Route map overlay lifecycle through bus once
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/map-overlay-lifecycle-boundary
          fetch-depth: 0

      - name: Apply map overlay lifecycle boundary
        run: |
          node scripts/migrate-map-overlay-lifecycle.mjs
          node --check js/main-ui.js
          node --check js/enhancements.js
          git diff --check

      - name: Commit migration
        run: |
          if git diff --quiet -- js/main-ui.js js/enhancements.js; then
            echo "Map overlay lifecycle boundary already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main-ui.js js/enhancements.js
          git commit -m "refactor: move map overlay lifecycle behind bus requests"
          git push origin HEAD:refactor/map-overlay-lifecycle-boundary
