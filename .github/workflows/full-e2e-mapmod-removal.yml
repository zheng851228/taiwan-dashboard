name: Full E2E MapMod Removal Validation

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - .github/workflows/full-e2e-mapmod-removal.yml

permissions:
  contents: read

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chrome
      - name: Run full E2E suite
        run: npm run test:e2e
