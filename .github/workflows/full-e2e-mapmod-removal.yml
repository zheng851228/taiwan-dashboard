name: Full E2E MapMod Removal Validation

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - .github/workflows/full-e2e-mapmod-removal.yml
      - js/main-ui.js
      - tests/e2e/**
      - playwright.config.js

permissions:
  contents: read

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chrome webkit
      - name: Run full E2E suite
        shell: bash
        run: |
          set +e
          set -o pipefail
          # ubuntu-latest has constrained software WebGL; serialize MapLibre-heavy E2E pages.
          npm run test:e2e -- --reporter=line --workers=1 2>&1 | tee /tmp/full-e2e.log
          status=${PIPESTATUS[0]}
          echo "===== full E2E tail ====="
          tail -n 300 /tmp/full-e2e.log
          exit "$status"
