name: Validate route seam (one-time)

on:
  push:
    branches:
      - refactor/maplibre-route-layer

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/maplibre-route-layer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome

      - name: Run desktop seam regressions
        run: npx playwright test tests/e2e/desktop-layout.spec.js tests/e2e/maplibre-camera-layer.spec.js tests/e2e/maplibre-route-layer.spec.js --project=desktop-chromium

      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/validate-route-seam-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-route-seam-once.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-time route seam validation workflow"
            git push origin HEAD:refactor/maplibre-route-layer
          fi
