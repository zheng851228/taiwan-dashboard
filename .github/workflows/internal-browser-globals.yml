name: Internal Browser Globals Cleanup

on:
  push:
    branches:
      - refactor/internal-browser-globals

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove internal browser globals once
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/internal-browser-globals
          fetch-depth: 0

      - name: Apply internal global cleanup
        run: |
          node scripts/remove-internal-browser-globals.mjs
          node --check js/main-ui.js
          node --check js/desktop-dashboard.js
          git diff --check

      - name: Commit cleanup
        run: |
          if git diff --quiet -- js/main-ui.js js/desktop-dashboard.js; then
            echo "Internal global cleanup already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main-ui.js js/desktop-dashboard.js
          git commit -m "refactor: keep internal browser modules off window"
          git push origin HEAD:refactor/internal-browser-globals
