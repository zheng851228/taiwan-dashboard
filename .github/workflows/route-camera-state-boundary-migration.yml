name: Route Camera State Boundary Migration

on:
  push:
    branches:
      - refactor/route-camera-state-boundary

permissions:
  contents: write

jobs:
  migrate:
    name: Move external camera reads to event snapshots once
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/route-camera-state-boundary
          fetch-depth: 0

      - name: Apply route camera state boundary
        run: |
          node scripts/migrate-route-camera-state-boundary.mjs
          node --check js/desktop-dashboard.js
          node --check js/enhancements.js
          node --check tests/e2e/route-camera-state-boundary.spec.js
          sh -n scripts/check.sh
          git diff --check

      - name: Commit migration
        run: |
          if git diff --quiet -- js/desktop-dashboard.js js/enhancements.js scripts/check.sh; then
            echo "Route camera state boundary already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/desktop-dashboard.js js/enhancements.js scripts/check.sh
          git commit -m "refactor: consume route cameras from event snapshots"
          git push origin HEAD:refactor/route-camera-state-boundary
