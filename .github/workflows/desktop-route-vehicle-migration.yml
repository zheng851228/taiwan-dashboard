name: Desktop Route Vehicle Migration

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/migrate-desktop-route-vehicle.mjs
      - .github/workflows/desktop-route-vehicle-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Apply desktop vehicle-state migration
        run: node scripts/migrate-desktop-route-vehicle.mjs
      - name: Commit migration result
        run: |
          if git diff --quiet -- js/desktop-dashboard.js js/pwa.js; then
            echo "No desktop vehicle-state changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/desktop-dashboard.js js/pwa.js
          git commit -m "refactor: consume vehicle state from bus events"
          git push origin HEAD:agent/portfolio-maintainability-pass
