name: Map Overlay Docs Migration

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/update-map-overlay-docs.mjs
      - .github/workflows/map-overlay-docs-migration.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Update architecture documentation
        run: node scripts/update-map-overlay-docs.mjs
      - name: Commit documentation
        run: |
          if git diff --quiet -- docs/ARCHITECTURE.md; then
            echo "No documentation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md
          git commit -m "docs: record map overlay request boundary"
          git push origin HEAD:agent/portfolio-maintainability-pass
