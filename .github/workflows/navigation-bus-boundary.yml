name: Navigation Bus Boundary

on:
  push:
    branches:
      - refactor/navigation-bus-boundary

permissions:
  contents: write

jobs:
  migrate:
    name: Route page navigation through bus once
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/navigation-bus-boundary
          fetch-depth: 0

      - name: Apply navigation bus boundary
        run: |
          node scripts/wire-navigation-bus-boundary.mjs
          node --check js/main-ui.js
          node --check js/desktop-dashboard.js
          node --check js/enhancements.js
          node --check js/ride-tools.js
          git diff --check

      - name: Commit migration
        run: |
          if git diff --quiet -- js/main-ui.js js/desktop-dashboard.js js/enhancements.js js/ride-tools.js; then
            echo "Navigation bus boundary already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main-ui.js js/desktop-dashboard.js js/enhancements.js js/ride-tools.js
          git commit -m "refactor: route page navigation through bus requests"
          git push origin HEAD:refactor/navigation-bus-boundary
