name: Route Condition Map Boundary Migration

on:
  push:
    branches:
      - refactor/route-condition-map-boundary

permissions:
  contents: write

jobs:
  migrate:
    name: Route condition map commands through bus once
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/route-condition-map-boundary
          fetch-depth: 0

      - name: Apply route-condition map boundary
        run: |
          node scripts/migrate-route-condition-map-boundary.mjs
          node --check js/main-ui.js
          node --check js/route-conditions.js
          git diff --check

      - name: Commit migration
        run: |
          if git diff --quiet -- js/main-ui.js js/route-conditions.js; then
            echo "Route-condition map boundary already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main-ui.js js/route-conditions.js
          git commit -m "refactor: route condition map commands through bus requests"
          git push origin HEAD:refactor/route-condition-map-boundary
