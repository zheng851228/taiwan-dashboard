name: Desktop Route Camera Migration

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/migrate-desktop-route-cameras.mjs
      - .github/workflows/desktop-route-camera-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Apply desktop route camera migration
        run: node scripts/migrate-desktop-route-cameras.mjs
      - name: Commit migration result
        run: |
          if git diff --quiet -- js/desktop-dashboard.js; then
            echo "No desktop route-camera changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/desktop-dashboard.js
          git commit -m "refactor: consume route cameras from bus payload"
          git push origin HEAD:agent/portfolio-maintainability-pass
