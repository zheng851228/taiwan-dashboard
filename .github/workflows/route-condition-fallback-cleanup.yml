name: Route Condition Fallback Cleanup

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/cleanup-route-condition-fallback.mjs
      - .github/workflows/route-condition-fallback-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass

      - name: Apply fallback cleanup
        run: node scripts/cleanup-route-condition-fallback.mjs

      - name: Commit cleanup result
        run: |
          if git diff --quiet -- js/route-conditions.js; then
            echo "No route-condition cleanup changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/route-conditions.js
          git commit -m "refactor: remove route condition fallbacks"
          git push origin HEAD:agent/portfolio-maintainability-pass
