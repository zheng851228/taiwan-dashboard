name: RouteMod Consumer Audit

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/audit-routemod-consumers.mjs
      - .github/workflows/routemod-consumer-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Audit RouteMod consumers
        run: node scripts/audit-routemod-consumers.mjs
