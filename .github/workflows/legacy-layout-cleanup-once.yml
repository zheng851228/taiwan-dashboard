name: Legacy desktop layout cleanup (one-time)

on:
  push:
    branches:
      - refactor/remove-legacy-desktop-layout

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/remove-legacy-desktop-layout

      - name: Apply historical layout-removal patch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 5a3076b8c91f3ed72625902580179958c114898f || true
          git show --format= --binary 5a3076b8c91f3ed72625902580179958c114898f -- js/desktop-dashboard.js > /tmp/layout-removal.patch
          test -s /tmp/layout-removal.patch
          git apply --3way /tmp/layout-removal.patch
          git diff --check
          node --check js/desktop-dashboard.js

      - name: Remove one-time workflow and commit result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/legacy-layout-cleanup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/desktop-dashboard.js
          git commit -m 'refactor: remove legacy desktop layout implementation'
          git push origin HEAD:refactor/remove-legacy-desktop-layout
