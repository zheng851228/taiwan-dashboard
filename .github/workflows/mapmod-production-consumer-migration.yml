name: MapMod Production Consumer Migration

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/migrate-mapmod-production-consumers.mjs
      - .github/workflows/mapmod-production-consumer-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Apply MapMod consumer migration
        run: node scripts/migrate-mapmod-production-consumers.mjs
      - name: Commit migration result
        run: |
          if git diff --quiet -- js/main-ui.js js/pwa.js js/route-conditions.js; then
            echo "No MapMod production consumer changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main-ui.js js/pwa.js js/route-conditions.js
          git commit -m "refactor: route remaining map consumers through requests"
          git push origin HEAD:agent/portfolio-maintainability-pass
