name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

  desktop-seam-e2e:
    name: Desktop browser seam regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome

      - name: Run desktop seam regressions
        run: npx playwright test tests/e2e/desktop-layout.spec.js tests/e2e/maplibre-camera-layer.spec.js tests/e2e/maplibre-route-layer.spec.js tests/e2e/maplibre-condition-layer.spec.js tests/e2e/desktop-route-condition-view-model.spec.js tests/e2e/desktop-route-search-model.spec.js tests/e2e/desktop-route-summary-model.spec.js tests/e2e/desktop-route-navigation-model.spec.js tests/e2e/browser-global-boundary.spec.js tests/e2e/desktop-map-request.spec.js tests/e2e/desktop-map-overlay-request.spec.js tests/e2e/route-command-boundary.spec.js tests/e2e/route-active-state-boundary.spec.js tests/e2e/route-camera-state-boundary.spec.js tests/e2e/history-vehicle-state-boundary.spec.js tests/e2e/desktop-vehicle-state-boundary.spec.js --project=desktop-chromium

  full-e2e:
    name: Full e2e (desktop Chrome + iPhone WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome webkit

      # The whole suite: desktop command center in Chrome, and the phone UI in WebKit - the
      # engine the owner's iPhone home-screen app runs on.  Tiles and terrain are stubbed in the
      # specs, and the Worker runs in fixture mode, so the run is hermetic.
      - name: Run full e2e suite
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: npx playwright test --project=desktop-chromium --project=iphone --reporter=list,json

      # One annotation listing every failing test and its first error line, so failures are
      # readable on the PR page without downloading the log.
      - name: Summarize failures
        if: failure()
        run: node scripts/e2e-failure-summary.mjs e2e-results.json

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
