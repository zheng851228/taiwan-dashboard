name: Route Search Wiring

on:
  push:
    branches:
      - refactor/wire-route-search-model

permissions:
  contents: write

jobs:
  wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/wire-route-search-model
          fetch-depth: 0
      - name: Apply remaining wiring
        run: node scripts/wire-route-search-runtime.mjs
      - name: Commit remaining wiring
        run: |
          if git diff --quiet -- index.html sw.js scripts/check.sh; then
            echo "Remaining wiring already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js scripts/check.sh
          git commit -m "refactor: complete route search runtime wiring"
          git push origin HEAD:refactor/wire-route-search-model
