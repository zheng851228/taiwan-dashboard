name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-route-condition-fallbacks:
    name: Remove route condition fallbacks once
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/remove-route-condition-fallbacks'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-route-condition-fallbacks
          fetch-depth: 0

      - name: Remove model-owned fallbacks
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'js/route-conditions.js';
          let source = fs.readFileSync(file, 'utf8');

          function removeRange(startMarker, endMarker) {
            const start = source.indexOf(startMarker);
            if (start === -1) throw new Error(`Missing start marker: ${startMarker}`);
            const end = source.indexOf(endMarker, start);
            if (end === -1) throw new Error(`Missing end marker: ${endMarker}`);
            source = source.slice(0, start) + source.slice(end);
          }

          function replaceFunction(name, nextName, body) {
            const startMarker = `  function ${name}(`;
            const nextMarker = `\n  function ${nextName}(`;
            const start = source.indexOf(startMarker);
            if (start === -1) throw new Error(`Missing function: ${name}`);
            const next = source.indexOf(nextMarker, start);
            if (next === -1) throw new Error(`Missing next function after ${name}: ${nextName}`);
            const headerEnd = source.indexOf('{', start);
            if (headerEnd === -1 || headerEnd > next) throw new Error(`Malformed function: ${name}`);
            const header = source.slice(start, headerEnd + 1);
            source = source.slice(0, start) + header + '\n' + body + '\n  }' + source.slice(next);
          }

          removeRange('  var ROAD_EVENT_KINDS = {', '  var currentRoute = null;');
          removeRange('  function inferRoadEventKind(', '  function eventDateTime(');

          replaceFunction(
            'roadEventPresentation',
            'primaryRoadEvent',
            '    return window.RouteConditionViewModel.roadEventPresentation(incident);'
          );
          replaceFunction(
            'primaryRoadEvent',
            'roadEventLocationIsApproximate',
            '    return window.RouteConditionViewModel.primaryRoadEvent(incidents);'
          );
          replaceFunction(
            'roadEventLocationIsApproximate',
            'summarizeRoadEvents',
            '    return window.RouteConditionViewModel.roadEventLocationIsApproximate(incident);'
          );
          replaceFunction(
            'summarizeRoadEvents',
            'roadEventCoverageText',
            '    return window.RouteConditionViewModel.summarizeRoadEvents(sections);'
          );
          removeRange('  function conditionAlert(', '  function buildAlerts(');
          replaceFunction(
            'buildAlerts',
            'renderAlerts',
            '    return window.RouteConditionViewModel.buildAlerts(sections);'
          );

          const forbidden = [
            'var ROAD_EVENT_KINDS =',
            'var ROAD_EVENT_IMPACTS =',
            'var ROAD_EVENT_MAP_COLORS =',
            'var ROAD_EVENT_IMPACT_MAP_COLORS =',
            'function inferRoadEventKind(',
            'function inferRoadEventImpact(',
            'function hasBlockedLaneImpact(',
            'function conditionAlert('
          ];
          for (const token of forbidden) {
            if (source.includes(token)) throw new Error(`legacy fallback token remains: ${token}`);
          }

          const required = [
            'function roadEventPresentation(incident)',
            'return window.RouteConditionViewModel.roadEventPresentation(incident);',
            'function primaryRoadEvent(incidents)',
            'return window.RouteConditionViewModel.primaryRoadEvent(incidents);',
            'function roadEventLocationIsApproximate(incident)',
            'return window.RouteConditionViewModel.roadEventLocationIsApproximate(incident);',
            'function summarizeRoadEvents(sections)',
            'return window.RouteConditionViewModel.summarizeRoadEvents(sections);',
            'function buildAlerts(sections)',
            'return window.RouteConditionViewModel.buildAlerts(sections);',
            'window.getRoadEventPresentation = roadEventPresentation;',
            'window.getPrimaryRoadEvent = primaryRoadEvent;'
          ];
          for (const token of required) {
            if (!source.includes(token)) throw new Error(`required route-condition wrapper missing: ${token}`);
          }

          fs.writeFileSync(file, source);
          NODE

          node --check js/route-conditions.js
          git diff --check
          git diff -- js/route-conditions.js

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/route-conditions.js
          git commit -m "refactor: remove route condition fallbacks"
          git push origin HEAD:refactor/remove-route-condition-fallbacks

  check:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

  desktop-seam-e2e:
    name: Desktop browser seam regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome

      - name: Run desktop seam regressions
        run: npx playwright test tests/e2e/desktop-layout.spec.js tests/e2e/maplibre-camera-layer.spec.js tests/e2e/maplibre-route-layer.spec.js tests/e2e/maplibre-condition-layer.spec.js tests/e2e/desktop-route-condition-view-model.spec.js --project=desktop-chromium
