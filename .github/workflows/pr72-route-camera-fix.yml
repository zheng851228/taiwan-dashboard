name: Apply PR72 route camera boundary fix

on:
  push:
    branches:
      - refactor/route-camera-state-boundary
    paths:
      - .github/workflows/pr72-route-camera-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/route-camera-state-boundary
          fetch-depth: 0

      - name: Apply narrow state-boundary fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/enhancements.js')
          text = path.read_text()

          replacements = [
              (
                  "var RouteStripMod = {\n  routeCameras: [],\n",
                  "var RouteStripMod = (function() {\n  var routeCameras = [];\n  var api = {\n",
              ),
              (
                  "      RouteStripMod.show(RouteStripMod.routeCameras);",
                  "      RouteStripMod.show(routeCameras);",
              ),
              (
                  "  }\n};\n\nBus.on('route:updated', function(payload) {\n  RouteStripMod.routeCameras = (payload && payload.cams || []).slice();\n});\nBus.on('route:cleared', function() {\n  RouteStripMod.routeCameras = [];\n});\n\n// ===== 地名建議模組 =====",
                  "  }\n  };\n\n  Bus.on('route:updated', function(payload) {\n    routeCameras = (payload && payload.cams || []).slice();\n  });\n  Bus.on('route:cleared', function() {\n    routeCameras = [];\n  });\n\n  return api;\n})();\n\n// ===== 地名建議模組 =====",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact replacement, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          if 'RouteStripMod.routeCameras' in text:
              raise SystemExit('public RouteStripMod.routeCameras reference remains')

          path.write_text(text)

          test = Path('tests/e2e/route-camera-state-boundary.spec.js')
          lines = [
              "import { test, expect } from '@playwright/test';",
              "import { gotoFixtureApp } from './helpers/fixture-app.js';",
              "",
              "const ROUTE_CAMS = [",
              "  {",
              "    id: 'route-cam-north',",
              "    name: 'route camera north',",
              "    lat: 25.032,",
              "    lng: 121.565,",
              "    imageUrl: 'https://example.test/route-camera-north.jpg',",
              "  },",
              "  {",
              "    id: 'route-cam-south',",
              "    name: 'route camera south',",
              "    lat: 25.022,",
              "    lng: 121.575,",
              "    imageUrl: 'https://example.test/route-camera-south.jpg',",
              "  },",
              "];",
              "",
              "const STALE_CONDITION_CAMS = [",
              "  {",
              "    id: 'stale-condition-cam',",
              "    name: 'stale condition camera',",
              "    lat: 25.03,",
              "    lng: 121.56,",
              "    imageUrl: 'https://example.test/stale-condition-camera.jpg',",
              "  },",
              "];",
              "",
              "test.describe('route camera state boundary', () => {",
              "  test('desktop and strip consume the route camera snapshot without exposing it', async ({ page }) => {",
              "    test.skip(test.info().project.name !== 'desktop-chromium', 'desktop regression coverage');",
              "",
              "    await page.addInitScript(() => {",
              "      localStorage.setItem('guide_done_v1', '1');",
              "    });",
              "    await gotoFixtureApp(page);",
              "    await page.waitForFunction(() => window.Bus && window.RouteStripMod && window.DesktopApp);",
              "",
              "    await page.evaluate(({ routeCams, staleCams }) => {",
              "      window.Bus.emit('route:updated', { coords: [], cams: routeCams });",
              "      window.Bus.emit('conditions:updated', {",
              "        events: [],",
              "        weather: null,",
              "        cctv: staleCams,",
              "        cams: staleCams,",
              "      });",
              "      window.DesktopApp.updateConditions([], null, staleCams);",
              "      window.RouteStripMod.toggle();",
              "    }, { routeCams: ROUTE_CAMS, staleCams: STALE_CONDITION_CAMS });",
              "",
              "    await expect(page.locator('#deskCctvCount')).toHaveText('2 支');",
              "    await expect(page.locator('#route-camera-strip')).toContainText('route camera north');",
              "    await expect(page.locator('#route-camera-strip')).not.toContainText('stale condition camera');",
              "    expect(await page.evaluate(() => Object.prototype.hasOwnProperty.call(window.RouteStripMod, 'routeCameras'))).toBe(false);",
              "",
              "    await page.evaluate(() => {",
              "      window.Bus.emit('route:cleared', {});",
              "      window.RouteStripMod.hide();",
              "      window.RouteStripMod.toggle();",
              "    });",
              "",
              "    await expect(page.locator('#route-camera-strip')).not.toHaveClass(/visible/);",
              "  });",
              "});",
              "",
          ]
          test.write_text('\n'.join(lines))
          PY

          git diff --check
          node --check js/enhancements.js
          node --check tests/e2e/route-camera-state-boundary.spec.js

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr72-route-camera-fix.yml
          git add js/enhancements.js tests/e2e/route-camera-state-boundary.spec.js
          git diff --cached --check
          git commit -m "test: validate route camera boundary through public behavior"
          git push origin HEAD:refactor/route-camera-state-boundary
