name: Internal Browser Global Cleanup

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/migrate-internal-browser-globals.mjs
      - .github/workflows/internal-browser-global-cleanup.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Apply internal global cleanup
        run: node scripts/migrate-internal-browser-globals.mjs
      - name: Commit migration result
        run: |
          if git diff --quiet -- js/main-ui.js js/desktop-dashboard.js; then
            echo "No internal-global cleanup changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main-ui.js js/desktop-dashboard.js
          git commit -m "refactor: keep internal browser modules off window"
          git push origin HEAD:agent/portfolio-maintainability-pass
