name: PWA Map Boundary Migration

on:
  push:
    branches:
      - refactor/pwa-map-boundary

permissions:
  contents: write

jobs:
  migrate:
    name: Route offline map commands through bus once
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/pwa-map-boundary
          fetch-depth: 0

      - name: Apply PWA map boundary
        run: |
          node scripts/migrate-pwa-map-boundary.mjs
          node --check js/main-ui.js
          node --check js/pwa.js
          node --check tests/e2e/desktop-map-request.spec.js
          sh -n scripts/check.sh
          git diff --check

      - name: Commit migration
        run: |
          if git diff --quiet -- js/main-ui.js js/pwa.js tests/e2e/desktop-map-request.spec.js scripts/check.sh; then
            echo "PWA map boundary already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main-ui.js js/pwa.js tests/e2e/desktop-map-request.spec.js scripts/check.sh
          git commit -m "refactor: route offline map commands through bus requests"
          git push origin HEAD:refactor/pwa-map-boundary
