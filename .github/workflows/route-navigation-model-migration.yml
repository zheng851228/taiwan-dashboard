name: Route Navigation Model Migration

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/migrate-route-navigation-model.mjs
      - .github/workflows/route-navigation-model-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass

      - name: Apply route navigation model migration
        run: node scripts/migrate-route-navigation-model.mjs

      - name: Commit migration result
        run: |
          if git diff --quiet -- js/route-conditions.js index.html; then
            echo "No route-navigation migration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/route-conditions.js index.html
          git commit -m "refactor: delegate external navigation handoff"
          git push origin HEAD:agent/portfolio-maintainability-pass
