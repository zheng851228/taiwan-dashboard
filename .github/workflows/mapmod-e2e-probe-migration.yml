name: MapMod E2E Probe Migration

on:
  push:
    branches:
      - agent/portfolio-maintainability-pass
    paths:
      - scripts/migrate-mapmod-e2e-probe-v2.mjs
      - .github/workflows/mapmod-e2e-probe-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-maintainability-pass
      - name: Apply corrected E2E probe migration
        run: node scripts/migrate-mapmod-e2e-probe-v2.mjs
      - name: Commit migration result
        run: |
          if git diff --quiet -- js/main-ui.js tests/e2e/dashboard.spec.js; then
            echo "No E2E probe changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main-ui.js tests/e2e/dashboard.spec.js
          git commit -m "test: decouple E2E map probes from MapMod global"
          git push origin HEAD:agent/portfolio-maintainability-pass
