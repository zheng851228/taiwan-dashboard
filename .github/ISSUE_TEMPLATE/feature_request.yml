name: 功能提案 / Feature request
description: 描述使用情境、問題與希望的改善。
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: 請先搜尋既有 Issue，並勿貼上金鑰或私人位置。
  - type: textarea
    id: problem
    attributes:
      label: 使用情境與問題 / Use case and problem
      description: 誰在什麼情況下遇到什麼困難？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的改善 / Proposed improvement
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案 / Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: 補充資料 / Additional context
      description: 可附公開資料來源或已遮蔽敏感資訊的示意圖。
